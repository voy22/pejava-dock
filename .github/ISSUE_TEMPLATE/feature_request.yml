name: Feature request
description: Suggest an idea for PejavaDock
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The task or problem, not only the solution. Why does it matter to you?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea of the feature. Screenshots of other apps that do it well help.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do now?
      description: Workarounds or other apps you use for it.
